<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ma To-Do List Personnelle</

title>

<style>

:root {

--bg-color: #edf2f7;

--card-bg: #ffffff;

--text-main: #1a202c;

--text-muted: #718096;

--accent: #3182ce;

--accent-hover: #2b6cb0;

--danger: #e53e3e;

  --border-color: #cbd5e0;


/* Couleurs de catégories vives */

--tag-personnel: #10b981;

--tag-travail: #ff5a1f;

--tag-loisirs: #8b5cf6;

}



* {

box-sizing: border-box;

margin: 0;

padding: 0;

font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

}



body {

background-color: var(--bg-color);

color: var(--text-main);

display: flex;

justify-content: center;

padding: 40px 20px;

}



.container {

width: 100%;

max-width: 520px;

background: var(--card-bg);

padding: 30px;

border-radius: 20px;

box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);

}



header {

margin-bottom: 24px;

border-bottom: 2px dashed #e2e8f0;

padding-bottom: 16px;

}



header h1 {

font-size: 26px;

font-weight: 700;

text-align: center;

letter-spacing: -0.5px;

color: #2d3748;

margin-bottom: 8px;

}



.stats {

font-size: 14px;

color: #4a5568;

text-align: center;

font-weight: 600;

background: #f7fafc;

display: inline-block;

padding: 4px 12px;

border-radius: 20px;

margin: 0 auto;

display: table;

}



.input-container {

display: flex;

flex-direction: column;

gap: 10px;

margin-bottom: 20px;

}



.input-group {

display: flex;

gap: 10px;

}



input[type="text"] {

flex: 1;

padding: 12px 16px;

border: 2px solid var(--border-color);

border-radius: 10px;

font-size: 15px;

outline: none;

transition: all 0.2s;

font-weight: 500;

}



input[type="text"]:focus {

border-color: var(--accent);

box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);

}



select {

padding: 12px;

border: 2px solid var(--border-color);

border-radius: 10px;

font-size: 14px;

background-color: white;

outline: none;

cursor: pointer;

font-weight: 600;

transition: border-color 0.2s;

}



select:focus {

border-color: var(--accent);

}



button.add-btn {

background-color: var(--accent);

color: white;

border: none;

padding: 12px 20px;

border-radius: 10px;

font-size: 15px;

font-weight: 600;

cursor: pointer;

transition: background-color 0.2s, transform 0.1s;

}



button.add-btn:hover {

background-color: var(--accent-hover);

}



button.add-btn:active {

transform: scale(0.97);

}



/* Barre d'outils pour Filtres et Tri */

.controls-bar {

display: flex;

justify-content: space-between;

align-items: center;

gap: 10px;

margin-bottom: 20px;

background: #f7fafc;

padding: 10px;

border-radius: 10px;

border: 1px solid #e2e8f0;

}



.filter-group, .sort-group {

display: flex;

align-items: center;

gap: 6px;

font-size: 13px;

font-weight: 600;

color: #4a5568;

}



.select-filter {

padding: 6px 10px;

font-size: 13px;

border-radius: 6px;

border: 1px solid var(--border-color);

}



.sort-btn {

background: white;

border: 1px solid var(--border-color);

padding: 6px 12px;

border-radius: 6px;

cursor: pointer;

font-size: 13px;

font-weight: 600;

transition: all 0.2s;

}



.sort-btn:hover {

border-color: var(--accent);

color: var(--accent);

}



.todo-list {

list-style: none;

}



.todo-item {

display: flex;

align-items: center;

justify-content: space-between;

padding: 14px 8px;

border-bottom: 1px solid #edf2f7;

border-radius: 8px;

transition: background-color 0.2s;

animation: fadeIn 0.2s ease;

}



.todo-item:hover {

background-color: #f7fafc;

}



.todo-content {

display: flex;

align-items: center;

gap: 14px;

flex: 1;

cursor: pointer;

}



.checkbox {

width: 22px;

height: 22px;

border: 2px solid var(--border-color);

border-radius: 6px;

display: flex;

align-items: center;

justify-content: center;

transition: all 0.2s;

flex-shrink: 0;

background: white;

}



.todo-item:hover .checkbox {

border-color: var(--accent);

}



.text-container {

display: flex;

flex-direction: column;

gap: 6px;

}



.todo-text {

font-size: 16px;

font-weight: 500;

transition: all 0.2s;

word-break: break-word;

}



/* Style des Tags */

.tag {

font-size: 11px;

font-weight: 700;

padding: 3px 10px;

border-radius: 6px;

width: fit-content;

text-transform: uppercase;

letter-spacing: 0.5px;

color: white !important;

}

.tag-personnel { background-color: var(--tag-personnel); }

.tag-travail { background-color: var(--tag-travail); }

.tag-loisirs { background-color: var(--tag-loisirs); }



/* État complété */

.todo-item.completed .checkbox {

background-color: var(--accent);

border-color: var(--accent);

}



.todo-item.completed .checkbox::after {

content: "✓";

color: white;

font-size: 14px;

font-weight: bold;

}



.todo-item.completed .todo-text {

color: var(--text-muted);

text-decoration: line-through;

}



.todo-item.completed .tag {

opacity: 0.4;

filter: grayscale(30%);

}



.delete-btn {

background: none;

border: none;

color: var(--text-muted);

font-size: 18px;

cursor: pointer;

padding: 6px;

border-radius: 6px;

transition: all 0.2s;

}



.delete-btn:hover {

color: var(--danger);

background-color: #fff5f5;

}



.empty-state {

text-align: center;

color: var(--text-muted);

font-size: 15px;

margin-top: 24px;

font-style: italic;

}



@keyframes fadeIn {

from { opacity: 0; transform: translateY(4px); }

to { opacity: 1; transform: translateY(0); }

}

</style>

</head>

<body>



<div class="container">

<header>

<h1>Ma To-Do List</h1>

<div class="stats" id="todo-stats">0 tâche restante</div>

</header>



<!-- Formulaire d'ajout -->

<div class="input-container">

<div class="input-group">

<input type="text" id="todo-input" placeholder="Que devez-vous faire ?" autocomplete="off">

<select id="todo-category">

<option value="personnel">🏠 Perso</option>

<option value="travail">💼 Pro</option>

<option value="loisirs">🎉 Loisirs</option>

</select>

<button class="add-btn" id="add-button">Ajouter</button>

</div>

</div>



<!-- Barre de filtres et tris -->

<div class="controls-bar">

<div class="filter-group">

<label for="filter-select">Filtrer :</label>

<select id="filter-select" class="select-filter">

<option value="all">Tout voir</option>

<option value="active">⏳ En cours</option>

<option value="completed">✅ Terminées</option>

<option value="personnel">🏠 Uniquement Perso</option>

<option value="travail">💼 Uniquement Pro</option>

<option value="loisirs">🎉 Uniquement Loisirs</option>

</select>

</div>

<div class="sort-group">

<button id="sort-button" class="sort-btn">Tri : Date 🗓️</button>

</div>

</div>



<!-- Liste des tâches -->

<ul class="todo-list" id="todo-list"></ul>

<div class="empty-state" id="empty-state">Aucune tâche ne correspond à vos critères. ☀️</div>

</div>



<script>

const todoInput = document.getElementById('todo-input');
